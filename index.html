<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a1612" />
  <meta name="format-detection" content="telephone=no" />
  <title>Schnier Family Tree — Steven Dale Schnier</title>
  <meta name="description" content="Interactive family tree centered on Steven Dale Schnier, born 17 June 1972." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=1.9.5" />
</head>
<body>
  <header>
    <div class="brand">
      <h1>The Schnier Family Tree</h1>
      <p>Schnier of Dingstede · Oehlerts of Remsen · Steven Dale Schnier, b. 17 June 1972</p>
      <p class="meta" id="appMeta">v1.9.5 · visits — · unique —</p>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="Search a name…" autocomplete="off" enterkeyhint="search" />
      <select id="genFilter" aria-label="Filter generation">
        <option value="">All generations</option>
        <option value="-4">Dingstede Hof</option>
        <option value="-3">19th-century heir</option>
        <option value="-2">Johann Gerhard</option>
        <option value="-1">1907 generation</option>
        <option value="0">G. H.’s children</option>
        <option value="1">Gerald’s sons</option>
        <option value="2">Steven’s generation</option>
        <option value="3">Morgan, Jacob, and the triplets</option>
      </select>
      <button id="focusSteven" class="primary" type="button">Steven</button>
      <button id="resetView" type="button">Reset view</button>
    </div>
  </header>

  <main>
    <div class="stage-wrap">
      <canvas id="treeCanvas"></canvas>
      <div class="hint">Drag to pan · pinch to zoom · tap a name</div>
    </div>
  </main>

  <div id="modal" class="modal" aria-hidden="true">
    <button type="button" class="modal-backdrop" id="modalBackdrop" aria-label="Close biography"></button>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="personName">
      <div class="modal-bar">
        <span class="modal-bar-label">Biography</span>
        <button id="modalClose" class="modal-close" type="button" aria-label="Close">×</button>
      </div>
      <div id="panel" class="panel"></div>
    </div>
  </div>

  <script src="app.js?v=1.9.5"></script>
</body>
</html>
